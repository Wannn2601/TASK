<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 max-w-md w-full shadow-2xl text-white">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">TaskFlow</h1>
            <p class="text-slate-300 text-sm mt-2">Masuk untuk mengelola tugas proyek</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                <input type="text" id="username" required placeholder="Contoh: pm_admin / pgm_budi" 
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition-all">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/25 transition-all cursor-pointer">
                Masuk Sistem
            </button>
        </form>

        <div class="mt-6 text-center">
            <button onclick="seedDemoUsers()" class="text-xs text-emerald-400 hover:underline cursor-pointer">
                [Inisialisasi Akun Demo PM & Programmer ke Database]
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByljIox1p4QE2bMKk4bDcAum55DyvKHZw",
            authDomain: "asmaulhusna-f450b.firebaseapp.com",
            projectId: "asmaulhusna-f450b",
            storageBucket: "asmaulhusna-f450b.firebasestorage.app",
            messagingSenderId: "911657203642",
            appId: "1:911657203642:web:f706f7eb7a56a9312fcf83"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.seedDemoUsers = async () => {
            try {
                await setDoc(doc(db, "users", "pm_admin"), { username: "pm_admin", password: "123", role: "PM", nama: "Project Manager Utama" });
                await setDoc(doc(db, "users", "pgm_budi"), { username: "pgm_budi", password: "123", role: "pgm", nama: "Budi Programmer" });
                await setDoc(doc(db, "users", "pgm_ani"), { username: "pgm_ani", password: "123", role: "pgm", nama: "Ani Programmer" });
                Swal.fire("Berhasil", "Akun demo berhasil dibuat! Username: pm_admin (PM), pgm_budi, pgm_ani (Programmer). Password: 123", "success");
            } catch (e) {
                Swal.fire("Info", "Error: " + e.message, "info");
            }
        };

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();

            Swal.showLoading();
            try {
                const { getDocs, collection } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                const querySnapshot = await getDocs(collection(db, "users"));
                let loggedInUser = null;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.username === u && data.password === p) {
                        loggedInUser = data;
                    }
                });

                if (loggedInUser) {
                    const sessionData = {
                        user: loggedInUser.username,
                        role: loggedInUser.role, // 'PM' atau 'pgm'
                        nama: loggedInUser.nama,
                        loginTime: new Date().getTime()
                    };
                    localStorage.setItem("taskflow_session", JSON.stringify(sessionData));
                    
                    Swal.fire({
                        icon: "success",
                        title: "Login Berhasil!",
                        text: `Selamat datang, ${loggedInUser.nama}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = "home.html";
                    });
                } else {
                    Swal.fire("Gagal", "Username atau Password salah!", "error");
                }
            } catch (err) {
                Swal.fire("Error", err.message, "error");
            }
        });
    </script>
</body>
</html>
