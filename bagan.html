<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Tugas - TaskFlow Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('baganApp', () => ({
                session: JSON.parse(localStorage.getItem("taskflow_session") || "{}"),
                activeTeam: JSON.parse(localStorage.getItem("active_team") || "{}"),
                tasks: [],

                async initApp() {
                    const now = new Date().getTime();
                    if (!this.session.user || (now - this.session.loginTime > 30 * 60 * 1000)) {
                        localStorage.removeItem("taskflow_session");
                        window.location.href = "login.html";
                        return;
                    }
                    if (!this.activeTeam.id) {
                        window.location.href = "home.html";
                        return;
                    }

                    try {
                        const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                        const db = window.firebaseDb;

                        const taskSnap = await getDocs(collection(db, "tasks"));
                        let allTasks = taskSnap.docs.map(d => d.data());
                        
                        // Filter tugas berdasarkan team aktif & role user
                        allTasks = allTasks.filter(t => t.teamId === this.activeTeam.id);
                        if (this.session.role === 'pgm') {
                            allTasks = allTasks.filter(t => t.assignedTo === this.session.user);
                        }
                        this.tasks = allTasks;
                    } catch(e) { console.error(e); }
                },

                getTasksForDate(day) {
                    const targetDateStr = `2026-10-${day < 10 ? '0' + day : day}`;
                    return this.tasks.filter(t => t.tanggal === targetDateStr);
                },

                logout() {
                    localStorage.removeItem("taskflow_session");
                    localStorage.removeItem("active_team");
                    window.location.href = "login.html";
                }
            }));
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" x-data="baganApp()" x-init="initApp()">

     <!-- Navbar Responsif -->
<nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center space-x-8">
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TaskFlow</span>
                
                <!-- Menu Desktop -->
                <div class="hidden md:flex space-x-4 items-center">
                    <a href="home.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Home</a>
                    <a href="tugas.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen Tugas</a>
                    
                    <!-- Menu Khusus PM (Bagan Tugas & Manajemen User) -->
                    <template x-if="session.role === 'PM'">
                        <div class="flex space-x-4">
                            <a href="bagan.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Bagan Tugas</a>
                            <a href="user.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen User</a>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Kanan: Role, Logout & Tombol Burger Mobile -->
            <div class="flex items-center space-x-4">
                <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold" x-text="session.role"></span>
                <button @click="logout()" class="hidden md:inline-block text-sm bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/20 transition cursor-pointer">Keluar</button>

                <!-- Tombol Burger Mobile / Tablet -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white focus:outline-none cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Dropdown Menu Mobile & Tablet -->
    <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false" class="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-2" x-cloak>
        <a href="home.html" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-sm">Home</a>
        <a href="tugas.html" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-sm">Manajemen Tugas</a>
        
        <template x-if="session.role === 'PM'">
            <div class="space-y-2">
                <a href="bagan.html" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-sm">Bagan Tugas</a>
                <a href="user.html" class="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-sm">Manajemen User</a>
            </div>
        </template>

        <div class="pt-2 border-t border-slate-800">
            <button @click="logout()" class="w-full text-left px-3 py-2 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-sm transition">Keluar</button>
        </div>
    </div>
</nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white" x-text="'Bagan Jadwal: ' + activeTeam.namaAplikasi"></h1>
                <p class="text-slate-400 text-sm">Visualisasi linimasa tugas per tanggal untuk team aplikasi ini.</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs text-slate-300">
                Programmer Penanggung Jawab: <span class="text-emerald-400 font-bold" x-text="activeTeam.programmerId"></span>
            </div>
        </div>

        <!-- Bagan Timeline -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-xl overflow-x-auto">
            <div class="min-w-[800px] space-y-6">
                <div class="grid grid-cols-7 gap-3 border-b border-slate-800 pb-3 text-xs font-semibold text-slate-400 text-center">
                    <div>Senin, 19 Okt</div>
                    <div>Selasa, 20 Okt</div>
                    <div>Rabu, 21 Okt</div>
                    <div>Kamis, 22 Okt</div>
                    <div>Jumat, 23 Okt</div>
                    <div>Sabtu, 24 Okt</div>
                    <div>Minggu, 25 Okt</div>
                </div>

                <div class="grid grid-cols-7 gap-3">
                    <template x-for="day in [19, 20, 21, 22, 23, 24, 25]">
                        <div class="bg-slate-800/30 border border-slate-800 rounded-2xl p-3 min-h-[160px] flex flex-col justify-between space-y-2">
                            <span class="text-xs text-slate-400 font-mono font-semibold" x-text="day + ' Okt 2026'"></span>
                            <div class="space-y-2 flex-grow overflow-y-auto">
                                <template x-for="task in getTasksForDate(day)">
                                    <div class="p-2 rounded-xl bg-indigo-500/20 border border-indigo-500/30 text-indigo-200 text-xs space-y-1">
                                        <div class="font-bold truncate" x-text="task.namaTugas"></div>
                                        <div class="text-[10px] text-emerald-300" x-text="'@' + task.assignedTo"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <!-- Inisialisasi Firebase Global -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByljIox1p4QE2bMKk4bDcAum55DyvKHZw",
            authDomain: "asmaulhusna-f450b.firebaseapp.com",
            projectId: "asmaulhusna-f450b",
            storageBucket: "asmaulhusna-f450b.firebasestorage.app",
            messagingSenderId: "911657203642",
            appId: "1:911657203642:web:f706f7eb7a56a9312fcf83"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseDb = getFirestore(app);
    </script>
</body>
</html>
