<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - TaskFlow Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('homeApp', () => ({
                session: JSON.parse(localStorage.getItem("taskflow_session") || "{}"),
                stats: { akanDatang: 0, berjalan: 0, belumSelesai: 0, selesai: 0 },
                teams: [],
                activeTasks: [],

                async initApp() {
                    const now = new Date().getTime();
                    if (!this.session.user || (now - this.session.loginTime > 30 * 60 * 1000)) {
                        localStorage.removeItem("taskflow_session");
                        window.location.href = "login.html";
                        return;
                    }
                    await this.fetchData();
                },

                async fetchData() {
                    try {
                        const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                        const db = window.firebaseDb;

                        // Ambil Data Team / Users
                        const userSnap = await getDocs(collection(db, "users"));
                        this.teams = userSnap.docs.map(d => {
                            const data = d.data();
                            return {
                                namaTeam: data.role === 'PM' ? 'Project Management' : 'Programmer Team',
                                namaOrang: data.nama,
                                role: data.role === 'PM' ? 'Project Manager' : 'Programmer'
                            };
                        });

                        // Ambil Data Tasks
                        const taskSnap = await getDocs(collection(db, "tasks"));
                        let tasks = taskSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                        // Jika login sebagai pgm, filter tugas yang ditugaskan ke user tersebut
                        if (this.session.role === 'pgm') {
                            tasks = tasks.filter(t => t.assignedTo && t.assignedTo.includes(this.session.user));
                        }

                        this.stats.akanDatang = tasks.filter(t => t.status === 'Akan Datang').length;
                        this.stats.berjalan = tasks.filter(t => t.status === 'Berjalan').length;
                        this.stats.belumSelesai = tasks.filter(t => t.status === 'Belum Selesai').length;
                        this.stats.selesai = tasks.filter(t => t.status === 'Selesai').length;

                        // List tugas yang belum selesai sampai berjalan
                        this.activeTasks = tasks.filter(t => t.status === 'Berjalan' || t.status === 'Belum Selesai' || t.status === 'Akan Datang');
                    } catch(e) { console.error(e); }
                },

                logout() {
                    localStorage.removeItem("taskflow_session");
                    localStorage.removeItem("active_team");
                    window.location.href = "login.html";
                }
            }));
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" x-data="homeApp()" x-init="initApp()">

    <!-- Navbar Responsif -->
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TaskFlow</span>
                    <div class="hidden md:flex space-x-4">
    <a href="home.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Home</a>
    <a href="tugas.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen Tugas</a>
    <!-- Menu Manajemen User HANYA MUNCUL JIKA ROLE == 'PM' -->
    <template x-if="session.role === 'PM'">
        <a href="bagan.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Bagan Tugas</a>
        <!-- <a href="user.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen User</a> -->
    </template>
    <template x-if="session.role === 'PM'">
        <!-- <a href="bagan.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Bagan Tugas</a> -->
        <a href="user.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen User</a>
    </template>
</div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold" x-text="session.role"></span>
                    <button @click="logout()" class="text-sm bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/20 transition cursor-pointer">Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <!-- Header Sambutan -->
        <div class="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white">Halo, <span x-text="session.nama"></span> 👋</h1>
                <p class="text-slate-400 text-sm mt-1">Berikut adalah ringkasan progres dan kinerja tugas Anda saat ini.</p>
            </div>
            <div class="text-xs text-slate-400 bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                Login sebagai: <strong class="text-emerald-400" x-text="session.role === 'PM' ? 'Project Manager' : 'Programmer'"></strong>
            </div>
        </div>

        <!-- Kartu Statistik Tugas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm">
                <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Akan Datang</p>
                <h3 class="text-3xl font-bold text-white mt-2" x-text="stats.akanDatang">0</h3>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm">
                <p class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Berjalan</p>
                <h3 class="text-3xl font-bold text-white mt-2" x-text="stats.berjalan">0</h3>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm">
                <p class="text-xs font-semibold text-rose-400 uppercase tracking-wider">Belum Selesai</p>
                <h3 class="text-3xl font-bold text-white mt-2" x-text="stats.belumSelesai">0</h3>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm">
                <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Selesai</p>
                <h3 class="text-3xl font-bold text-white mt-2" x-text="stats.selesai">0</h3>
            </div>
        </div>

        <!-- Grid Card Team & Daftar Tugas -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Card Team -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-xl lg:col-span-1">
                <h2 class="text-lg font-bold text-white mb-4">Anggota Tim & Role</h2>
                <div class="space-y-3 max-h-[350px] overflow-y-auto pr-2">
                    <template x-for="member in teams">
                        <div class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                            <div>
                                <h4 class="font-semibold text-white text-sm" x-text="member.namaOrang"></h4>
                                <p class="text-xs text-slate-400" x-text="member.namaTeam"></p>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-medium" x-text="member.role"></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- List Tugas Aktif -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-xl lg:col-span-2">
                <h2 class="text-lg font-bold text-white mb-4">Daftar Tugas Aktif (Akan Datang, Berjalan & Belum Selesai)</h2>
                <div class="space-y-3 max-h-[350px] overflow-y-auto pr-2">
                    <template x-for="task in activeTasks">
                        <div class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h4 class="font-semibold text-white text-sm" x-text="task.namaTugas"></h4>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold"
                                        :class="{
                                            'bg-amber-500/10 text-amber-400 border border-amber-500/20': task.status === 'Akan Datang',
                                            'bg-blue-500/10 text-blue-400 border border-blue-500/20': task.status === 'Berjalan',
                                            'bg-rose-500/10 text-rose-400 border border-rose-500/20': task.status === 'Belum Selesai'
                                        }"
                                        x-text="task.status"></span>
                                </div>
                                <p class="text-xs text-slate-400 mt-1" x-text="task.keterangan"></p>
                            </div>
                            <div class="text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 whitespace-nowrap" x-text="task.tanggal"></div>
                        </div>
                    </template>
                    <div x-show="activeTasks.length === 0" class="text-center py-8 text-slate-500 text-sm">
                        Tidak ada tugas aktif saat ini.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Inisialisasi Firebase Global -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByljIox1p4QE2bMKk4bDcAum55DyvKHZw",
            authDomain: "asmaulhusna-f450b.firebaseapp.com",
            projectId: "asmaulhusna-f450b",
            storageBucket: "asmaulhusna-f450b.firebasestorage.app",
            messagingSenderId: "911657203642",
            appId: "1:911657203642:web:f706f7eb7a56a9312fcf83"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseDb = getFirestore(app);
    </script>
</body>
</html>
