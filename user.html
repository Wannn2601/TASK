<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - TaskFlow Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('userApp', () => ({
                session: JSON.parse(localStorage.getItem("taskflow_session") || "{}"),
                users: [],
                searchQuery: '',
                showModal: false,
                isEdit: false,
                form: { id: '', username: '', password: '', nama: '', role: 'pgm' },

                async initApp() {
                    const now = new Date().getTime();
                    if (!this.session.user || (now - this.session.loginTime > 30 * 60 * 1000)) {
                        localStorage.removeItem("taskflow_session");
                        window.location.href = "login.html";
                        return;
                    }
                    await this.fetchUsers();
                },

                async fetchUsers() {
                    try {
                        const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                        const db = window.firebaseDb;

                        const snap = await getDocs(collection(db, "users"));
                        this.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    } catch(e) { 
                        console.error(e); 
                    }
                },

                async seedDefaultUsers() {
                    try {
                        const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                        const db = window.firebaseDb;

                        await setDoc(doc(db, "users", "pm_admin"), { username: "pm_admin", password: "123", role: "PM", nama: "Project Manager Utama" });
                        await setDoc(doc(db, "users", "pgm_budi"), { username: "pgm_budi", password: "123", role: "pgm", nama: "Budi Programmer" });
                        await setDoc(doc(db, "users", "pgm_ani"), { username: "pgm_ani", password: "123", role: "pgm", nama: "Ani Programmer" });
                        
                        await this.fetchUsers();
                        Swal.fire("Berhasil", "Akun demo berhasil dimuat ke database!", "success");
                    } catch (e) {
                        Swal.fire("Error", e.message, "error");
                    }
                },

                get filteredUsers() {
                    return this.users.filter(u => 
                        (u.nama && u.nama.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                        (u.username && u.username.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                        (u.role && u.role.toLowerCase().includes(this.searchQuery.toLowerCase()))
                    );
                },

                openModal() {
                    this.isEdit = false;
                    this.form = { id: '', username: '', password: '', nama: '', role: 'pgm' };
                    this.showModal = true;
                },

                editModal(user) {
                    this.isEdit = true;
                    this.form = { ...user };
                    this.showModal = true;
                },

                confirmSave() {
                    Swal.fire({
                        title: 'Konfirmasi Simpan',
                        text: 'Apakah Anda yakin ingin menyimpan data pengguna ini?',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: 'Ya, Simpan',
                        cancelButtonText: 'Batal',
                        background: '#0f172a',
                        color: '#f8fafc'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                const { doc, setDoc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                                const db = window.firebaseDb;

                                const userId = this.form.username.trim();
                                const { id, ...userData } = this.form;

                                if (this.isEdit) {
                                    await updateDoc(doc(db, "users", this.form.id), userData);
                                } else {
                                    await setDoc(doc(db, "users", userId), userData);
                                }

                                this.showModal = false;
                                await this.fetchUsers();
                                Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Data pengguna berhasil disimpan.', timer: 1500, showConfirmButton: false });
                            } catch(e) {
                                Swal.fire('Error', e.message, 'error');
                            }
                        }
                    });
                },

                deleteUser(id) {
                    Swal.fire({
                        title: 'Hapus Pengguna?',
                        text: 'Data pengguna yang dihapus tidak dapat dikembalikan!',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'Ya, Hapus',
                        cancelButtonText: 'Batal',
                        background: '#0f172a',
                        color: '#f8fafc'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                                const db = window.firebaseDb;

                                await deleteDoc(doc(db, "users", id));
                                await this.fetchUsers();
                                Swal.fire({ icon: 'success', title: 'Terhapus!', text: 'Pengguna berhasil dihapus.', timer: 1500, showConfirmButton: false });
                            } catch(e) {
                                Swal.fire('Error', e.message, 'error');
                            }
                        }
                    });
                },

                logout() {
                    localStorage.removeItem("taskflow_session");
                    localStorage.removeItem("active_team");
                    window.location.href = "login.html";
                }
            }));
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" x-data="userApp()" x-init="initApp()">

    <!-- Navbar -->
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TaskFlow</span>
                    <div class="hidden md:flex space-x-4">
    <a href="home.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Home</a>
    <a href="tugas.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen Tugas</a>
    <!-- Menu Manajemen User HANYA MUNCUL JIKA ROLE == 'PM' -->
    <template x-if="session.role === 'PM'">
        <a href="bagan.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Bagan Tugas</a>
        <!-- <a href="user.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen User</a> -->
    </template>
    <template x-if="session.role === 'PM'">
        <!-- <a href="bagan.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Bagan Tugas</a> -->
        <a href="user.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/50 text-sm">Manajemen User</a>
    </template>
</div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold" x-text="session.role"></span>
                    <button @click="logout()" class="text-sm bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/20 transition cursor-pointer">Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Manajemen Pengguna (User)</h1>
                <p class="text-slate-400 text-sm">Kelola akun Project Manager dan Programmer sistem.</p>
            </div>
            <div class="flex items-center space-x-3">
                <button @click="seedDefaultUsers()" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 font-semibold px-4 py-2.5 rounded-xl transition text-sm cursor-pointer">
                    ⚡ Muat Akun Demo
                </button>
                <button @click="openModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center space-x-2 text-sm cursor-pointer">
                    <span>+ Tambah User</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex items-center">
            <input type="text" x-model="searchQuery" placeholder="Cari berdasarkan nama, username, atau role..." 
                class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 w-full sm:w-80">
        </div>

        <!-- Tabel Data User -->
        <div class="bg-slate-900/50 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/50 border-b border-slate-800 text-xs uppercase tracking-wider text-slate-400">
                            <th class="p-4">Nama Lengkap</th>
                            <th class="p-4">Username</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">Password</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60 text-sm">
                        <template x-for="user in filteredUsers" :key="user.id">
                            <tr class="hover:bg-slate-800/20 transition">
                                <td class="p-4 font-semibold text-white" x-text="user.nama"></td>
                                <td class="p-4 text-slate-300 font-mono" x-text="user.username"></td>
                                <td class="p-4">
                                    <span class="text-xs px-2.5 py-1 rounded-full font-semibold"
                                        :class="user.role === 'PM' ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'"
                                        x-text="user.role === 'PM' ? 'Project Manager (PM)' : 'Programmer (pgm)'"></span>
                                </td>
                                <td class="p-4 text-slate-400 font-mono" x-text="user.password"></td>
                                <td class="p-4 text-center space-x-2">
                                    <button @click="editModal(user)" class="px-3 py-1 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 rounded-lg border border-blue-500/20 text-xs transition cursor-pointer">Edit</button>
                                    <button @click="deleteUser(user.id)" class="px-3 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg border border-rose-500/20 text-xs transition cursor-pointer">Hapus</button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="filteredUsers.length === 0">
                            <td colspan="5" class="text-center py-8 text-slate-500">
                                Tidak ada data pengguna. Klik tombol <strong>"⚡ Muat Akun Demo"</strong> di atas untuk mengisi data awal.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form Tambah / Edit User -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <h3 class="text-xl font-bold text-white" x-text="isEdit ? 'Edit User' : 'Tambah User Baru'"></h3>
            
            <form @submit.prevent="confirmSave" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nama Lengkap</label>
                    <input type="text" x-model="form.nama" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Username / ID User</label>
                    <input type="text" x-model="form.username" required placeholder="Contoh: pgm_budi" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
                    <input type="text" x-model="form.password" required placeholder="••••••••" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Role</label>
                    <select x-model="form.role" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-400 text-sm">
                        <option value="PM">Project Manager (PM)</option>
                        <option value="pgm">Programmer (pgm)</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" @click="showModal = false" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm transition cursor-pointer">Batal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition cursor-pointer">Simpan</button>
                </div>
            </form>
        </div>
    </div>

        window.firebaseDb = getFirestore(app);
    </script>
</body>
</html>
